name: Build LectorXD APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "src/es/lectorxd/**"
      - ".github/workflows/build-lectorxd.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build LectorXD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Format LectorXD Kotlin
        run: ./gradlew :src:es:lectorxd:spotlessKotlinApply --stacktrace

      - name: Build LectorXD APK
        run: ./gradlew :src:es:lectorxd:assembleDebug --stacktrace

      - name: Find generated APK
        run: |
          echo "Generated APK files:"
          find src/es/lectorxd/build -type f -name "*.apk" -print

      - name: Upload LectorXD APK
        uses: actions/upload-artifact@v4
        with:
          name: LectorXD-Mihon-APK
          path: src/es/lectorxd/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
